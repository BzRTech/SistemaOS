<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login | Sistema de O.S. — Secretaria de Infraestrutura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --primaria: #c8102e;
  --primaria-escura: #7f0a1c;
  --primaria-clara: #fbe9ec;
  --preto-brasao: #1d1d1f;
  --cinza-bg: #f4f5f7;
  --cinza-borda: #e0e4e8;
  --cinza-texto: #5a6473;
  --cinza-escuro: #1e2532;
  --vermelho: #d32f2f;
  --vermelho-claro: #fdecea;
  --sombra: 0 4px 24px rgba(0,0,0,0.12);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--cinza-bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--sombra);
  width: 100%;
  max-width: 400px;
  overflow: hidden;
}

.card-topo {
  background: var(--primaria-escura);
  padding: 32px 28px 24px;
  text-align: center;
  color: white;
}
.logo {
  width: 60px; height: 60px;
  background: rgba(255,255,255,0.15);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  margin: 0 auto 16px;
}
.orgao { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
.titulo { font-size: 20px; font-weight: 800; margin-top: 4px; }
.subtitulo { font-size: 12px; opacity: 0.65; margin-top: 4px; }

.card-corpo { padding: 28px; }

.form-group { margin-bottom: 18px; }
.label {
  display: block;
  font-size: 11px; font-weight: 700;
  color: var(--cinza-texto);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--cinza-borda);
  border-radius: 10px;
  font-size: 15px;
  color: var(--cinza-escuro);
  background: white;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  appearance: none;
}
.input:focus { outline: none; border-color: var(--primaria); }

.senha-wrap { position: relative; }
.btn-olho {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: var(--cinza-texto); padding: 4px;
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primaria);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 4px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:hover { background: var(--primaria-escura); }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.alerta {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  display: none;
}
.alerta-erro { background: var(--vermelho-claro); color: var(--vermelho); border: 1px solid #f5c6c6; }
.alerta.visivel { display: block; }

.rodape {
  text-align: center;
  padding: 16px 28px;
  border-top: 1px solid var(--cinza-bg);
  font-size: 11px;
  color: var(--cinza-texto);
}

.spinner-btn {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="card-topo">
    <div class="logo">🏗️</div>
    <div class="orgao">Prefeitura Municipal de João Pessoa</div>
    <div class="titulo">Sistema de O.S.</div>
    <div class="subtitulo">SEINFRA · Empresa · Equipes</div>
  </div>

  <div class="card-corpo">
    <div class="alerta alerta-erro" id="alerta"></div>

    <form id="formLogin" onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label class="label" for="email">E-mail</label>
        <input class="input" type="email" id="email" name="email"
          placeholder="seu@email.com" autocomplete="email" required autofocus>
      </div>

      <div class="form-group">
        <label class="label" for="senha">Senha</label>
        <div class="senha-wrap">
          <input class="input" type="password" id="senha" name="senha"
            placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="btn-olho" onclick="toggleSenha()" title="Mostrar / ocultar senha">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <div class="spinner-btn" id="spinner"></div>
        <span id="btnTexto">Entrar</span>
      </button>
    </form>
  </div>

  <div class="rodape">
    Acesso restrito a servidores autorizados · SINFRA / PMJP
  </div>
</div>

<script>
(function() {
  const token = localStorage.getItem('os_token');
  if (token) {
    fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => { if (r.ok) window.location.replace('/index.html'); })
      .catch(() => {});
  }
})();

function toggleSenha() {
  const inp = document.getElementById('senha');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function mostrarAlerta(msg) {
  const el = document.getElementById('alerta');
  el.textContent = '⚠️ ' + msg;
  el.className = 'alerta alerta-erro visivel';
}

function ocultarAlerta() {
  document.getElementById('alerta').className = 'alerta alerta-erro';
}

async function fazerLogin(e) {
  e.preventDefault();
  ocultarAlerta();

  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn   = document.getElementById('btnLogin');
  const spinner = document.getElementById('spinner');
  const texto = document.getElementById('btnTexto');

  btn.disabled = true;
  spinner.style.display = 'block';
  texto.textContent = 'Entrando...';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha }),
    });
    const data = await r.json();

    if (!r.ok) {
      mostrarAlerta(data.erro || 'Erro ao fazer login');
      return;
    }

    localStorage.setItem('os_token', data.token);
    localStorage.setItem('os_usuario', JSON.stringify(data.usuario));
    window.location.replace('/index.html');
  } catch {
    mostrarAlerta('Erro de conexão com o servidor. Tente novamente.');
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    texto.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
