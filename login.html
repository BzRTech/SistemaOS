<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login | Sistema OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #7f0a1c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 36px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.logo {
  text-align: center;
  margin-bottom: 28px;
}
.logo-icon { font-size: 48px; display: block; margin-bottom: 8px; }
.logo h1 {
  font-size: 18px;
  font-weight: 700;
  color: #1d1d1f;
  line-height: 1.3;
}
.logo p {
  font-size: 12px;
  color: #6b7280;
  margin-top: 4px;
}
.campo {
  margin-bottom: 16px;
}
.campo label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.campo input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  color: #1d1d1f;
  background: #f9fafb;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.campo input:focus {
  border-color: #c8102e;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(200,16,46,.12);
}
.btn-login {
  width: 100%;
  padding: 13px;
  background: #c8102e;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background .15s;
}
.btn-login:hover { background: #a50d25; }
.btn-login:disabled { background: #d1d5db; cursor: not-allowed; }
.erro {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 14px;
  display: none;
}
.versao {
  text-align: center;
  font-size: 11px;
  color: #9ca3af;
  margin-top: 24px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🏗️</span>
    <h1>Secretaria de Infraestrutura</h1>
    <p>Sistema de Gestão de Ordens de Serviço</p>
  </div>

  <form id="formLogin" onsubmit="login(event)">
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    <div class="erro" id="erroMsg"></div>
  </form>

  <div class="versao">v2.0 · João Pessoa · Secretaria de Infraestrutura</div>
</div>

<script>
// Se já está autenticado, redireciona
(function() {
  const token = localStorage.getItem('os_token');
  if (token) {
    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => r.ok ? window.location.replace('/index.html') : null)
      .catch(() => {});
  }
})();

async function login(e) {
  e.preventDefault();
  const btn  = document.getElementById('btnLogin');
  const erro = document.getElementById('erroMsg');
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  erro.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.erro || 'Erro ao fazer login');
    localStorage.setItem('os_token', json.token);
    localStorage.setItem('os_usuario', JSON.stringify(json.usuario));
    window.location.replace('/index.html');
  } catch (e) {
    erro.textContent = e.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
